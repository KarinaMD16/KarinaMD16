name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # diario a medianoche UTC
  workflow_dispatch:       # poder ejecutarlo manualmente
  push:
    branches:
      - main               # opcional: regenera cuando haces push a main

permissions:
  contents: write          # NECESARIO para publicar en la rama output

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generar animación (clara y oscura)
        uses: Platane/snk@v3
        with:
          github_user_name: KarinaMD16
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publicar en rama output
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          force_orphan: true  # crea la rama output si no existe

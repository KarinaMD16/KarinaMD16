name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Corre todos los días a medianoche UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generar animación de Snake
        uses: Platane/snk@v3
        with:
          github_user_name: KarinaMD16
          outputs: dist/snake.svg

      - name: Publicar en rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
